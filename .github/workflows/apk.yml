# Gera o APK do Tutor de Inglês a cada mudança e publica numa versão (Release) com link fixo:
# https://github.com/<usuario>/tutor-ingles-android/releases/latest/download/tutor-ingles.apk
name: APK e Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Chave de assinatura
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/tutor.p12"
      - name: Gerar APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/tutor.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk tutor-ingles.apk && ls -l tutor-ingles.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tutor de Inglês ${{ github.run_number }}
          body: Baixe o arquivo tutor-ingles.apk abaixo e instale no celular (permita instalar desta fonte quando o Android pedir).
          files: tutor-ingles.apk
          make_latest: true

  # Instalador para Windows (Tauri, motor de páginas do próprio Windows): vai para a mesma versão do APK
  windows:
    needs: apk
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Gerar instalador
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx tauri icon icone.png
          npx tauri build
          cp src-tauri/target/release/bundle/nsis/*.exe ../tutor-ingles-setup.exe
          ls -l ../tutor-ingles-setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: tutor-ingles-setup.exe
